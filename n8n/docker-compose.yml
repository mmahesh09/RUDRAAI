version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: rudraai-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      # AI providers — used by HTTP Request nodes in workflows
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Notion integration
      - NOTION_API_KEY=${NOTION_API_KEY}
      - NOTION_LEADS_DB=${NOTION_LEADS_DB}
      - NOTION_ONBOARDING_DB=${NOTION_ONBOARDING_DB}
      # SMTP for email nodes
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - CONTACT_TO=${CONTACT_TO}
      # Slack (optional)
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows:ro
    extra_hosts:
      # So n8n can reach Ollama on your host machine
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
