version: "3.9"

services:
  redis:
    image: redis:7-alpine
    # Bound memory + LRU eviction so rate-limit keys can never OOM the host.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rudraai-backend:latest
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides any REDIS_URL in .env so the backend reaches the compose Redis.
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_CONSULTANT_NAME: ${NEXT_PUBLIC_CONSULTANT_NAME:-Automation Consultant}
    image: rudraai-frontend:latest
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:4000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      - backend
    restart: unless-stopped
